# Secret scan via open-source gitleaks (no gitleaks-action org license).
# GitHub secret scanning + push protection: run github-prepare-go-forge.sh on the repo.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
